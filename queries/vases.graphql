# Greek and Roman Art objects, paged, with the higher-level object fields.
#
# Field names follow the Met private collection API guide (verified there
# against Preview with an admin secret). This exact query has NOT been run:
# check it once with `python -m vasepipe check-hasura`.
#
# The department is filtered on the server ($where). Classification has no
# relationship filter on objects_crd, so vases and fragments are picked out
# after the fetch from classifications.primary and the object name.
# Strings on this deployment support _like, not _ilike.
query GreekRomanObjects($where: objects_crd_bool_exp!, $limit: Int!, $offset: Int!) {
  objects_crd(where: $where, limit: $limit, offset: $offset, order_by: { CRD_ObjectId: asc }) {
    CRD_ObjectId
    ObjectNumber
    ObjectName
    Culture
    Period
    Dated
    DateBegin
    DateEnd
    Medium
    tags { Term }
    apiObject {
      objectID
      accessionNumber
      department
      webLabel
      titles { primary { title } }
      artists { primary { displayName } }
      classifications { primary { classification } }
      images {
        primary { sourceImageUrl thumbnailImageUrl openAccess }
        all { sourceImageUrl thumbnailImageUrl openAccess }
      }
    }
  }
}
