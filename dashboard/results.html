<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vase pipeline results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--surface:#f4f4f4;--ink:#222222;--text:#6d6d6d;--divider:#e5e5e5;--border:#b8b8b8;
  --accent:#a6192e;--good:#006440;--focus:#001e50;--btn:#222222;--btn-ink:#ffffff;--warn-bg:#f8e08e;--warn-ink:#222222;--info-bg:#c8d8eb;
  --sp-micro:min(calc(8px + .25vw),12px);--sp-xxs:min(calc(16px + .5vw),24px);--sp-xs:min(calc(24px + .75vw),36px);--sp-m:min(calc(48px + 1.5vw),72px);
  --fs-xxs:clamp(10px,9.3px + .19vw,12px);--fs-xs:clamp(12px,11.3px + .19vw,14px);--fs-s:clamp(14px,13.3px + .19vw,16px);--fs-m:clamp(16px,14.6px + .38vw,20px);--fs-l:clamp(20px,18.2px + .47vw,25px);--fs-xl:clamp(25px,22.8px + .59vw,31px);--fs-xxl:clamp(31px,28.5px + .73vw,39px);
  --ui:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"The Met Serif",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;
  --bg:#161616;--surface:#242424;--ink:#f4f4f4;--text:#b8b8b8;--divider:#3a3a3a;--border:#6d6d6d;
  --accent:#f4c3cc;--good:#afe1a5;--focus:#99b9e4;--btn:#f4f4f4;--btn-ink:#222222;--warn-bg:#5a4a10;--warn-ink:#f4f4f4;--info-bg:#1f3350;}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:var(--fs-s);line-height:1.5}
.wrap{width:min(92vw,1600px);margin:0 auto;padding:var(--sp-xs) 0 var(--sp-m)}
a{color:var(--ink);text-underline-offset:3px}a:hover{color:var(--accent)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1{font-family:var(--serif);font-weight:400;font-size:var(--fs-xxl);line-height:1.2;margin:0}
h2{font-size:var(--fs-l);line-height:1.3;font-weight:600;margin:0 0 var(--sp-micro)}
h3{font-size:var(--fs-m);line-height:1.3;font-weight:600;margin:0 0 var(--sp-micro)}
p{margin:0 0 var(--sp-micro);max-width:76ch}
.muted{color:var(--text)}.small{font-size:var(--fs-xs)}
.head{border-bottom:1.5px solid var(--ink);padding-bottom:var(--sp-xxs)}
.head .sub{font-size:var(--fs-m);line-height:1.3;color:var(--text);margin-top:var(--sp-micro);max-width:70ch}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border-bottom:1px solid var(--divider)}
.kpi{padding:var(--sp-xxs) var(--sp-xxs) var(--sp-xxs) 0}
.kpi b{display:block;font-size:var(--fs-xl);line-height:1.2;font-weight:600;font-variant-numeric:tabular-nums}
.kpi span{color:var(--text);font-size:var(--fs-xs)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:var(--sp-xs);padding:var(--sp-xs) 0;border-bottom:1px solid var(--divider)}
.hbar{display:grid;grid-template-columns:minmax(110px,190px) minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:var(--fs-xs);padding:3px 0}
.bar{height:12px;background:var(--divider);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}
.bar.thin{height:6px;border-radius:3px;margin-top:2px}
.hbar .n{text-align:right;font-variant-numeric:tabular-nums}
.filters{display:flex;gap:var(--sp-micro);flex-wrap:wrap;align-items:end;padding:var(--sp-xs) 0 var(--sp-micro)}
.filters>div{flex:0 1 220px}.filters>.grow{flex:1 1 260px;max-width:420px}
label.lbl{display:block;font-size:var(--fs-xs);color:var(--text);margin-bottom:4px}
input[type=search],select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:9px 12px;min-height:44px;width:100%}
input:hover,select:hover{border-color:var(--ink)}
.btn{appearance:none;font:inherit;font-weight:600;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--ink);padding:10px 18px;min-height:44px;cursor:pointer}
.btn:hover{border-color:var(--ink)}.btn:disabled{opacity:.45;cursor:not-allowed}
.badge{display:inline-block;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;border:1px solid currentColor;border-radius:4px;padding:1px 6px;line-height:1.5;color:var(--text);white-space:nowrap}
.badge.good{color:var(--good)}.badge.bad{color:var(--accent)}.badge.ink{color:var(--ink)}
.item{border-bottom:1px solid var(--divider)}
.item>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:72px minmax(0,3fr) minmax(0,2fr) 24px 72px minmax(0,3fr) 56px;gap:var(--sp-micro);align-items:center;padding:var(--sp-micro) 0}
.item>summary::-webkit-details-marker{display:none}
.item>summary:hover .t{color:var(--accent)}
.thumb{width:72px;height:72px;border-radius:4px;background:var(--surface);object-fit:contain;display:block}
.thumb.none{display:grid;place-items:center;color:var(--text);font-size:var(--fs-xxs);text-align:center}
.t{font-weight:600}
.arrow{color:var(--text);text-align:center}
.score{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.detail{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:var(--sp-xs);padding:var(--sp-micro) 0 var(--sp-xs)}
.detail img.big{max-width:100%;max-height:460px;border-radius:4px;background:var(--surface);display:block}
.box{background:var(--surface);border-radius:4px;padding:var(--sp-xxs);margin-bottom:var(--sp-micro)}
.box p:last-child{margin-bottom:0}
dl.meta{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px var(--sp-xxs);margin:0 0 var(--sp-micro)}
dl.meta dt{color:var(--text);font-size:var(--fs-xs);padding-top:2px}dl.meta dd{margin:0;overflow-wrap:anywhere}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:var(--fs-xs)}
th,td{text-align:left;padding:6px 12px 6px 0;border-bottom:1px solid var(--divider);vertical-align:top}
th{color:var(--text);font-weight:600;white-space:nowrap}
.match{display:grid;grid-template-columns:96px minmax(0,1fr);gap:var(--sp-micro);padding:var(--sp-micro) 0;border-bottom:1px solid var(--divider)}
.match .thumb{width:96px;height:96px}
.views{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.views img{width:56px;height:56px;object-fit:contain;background:var(--surface);border-radius:4px}
.comps{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px;margin:6px 0;font-size:var(--fs-xxs);color:var(--text)}
.note{background:var(--info-bg);border-radius:4px;padding:var(--sp-micro) var(--sp-xxs);margin:var(--sp-xxs) 0}
.note.warn{background:var(--warn-bg);color:var(--warn-ink)}
.note p:last-child{margin-bottom:0}
.greek{font-family:var(--serif);font-size:1.05em}
.pager{display:flex;gap:var(--sp-micro);align-items:center;padding-top:var(--sp-xxs)}
code{font-size:.92em;background:var(--surface);padding:1px 5px;border-radius:3px}
@media (max-width:900px){
  .item>summary{grid-template-columns:56px minmax(0,1fr) 56px}
  .item>summary .c3,.item>summary .arrow,.item>summary .c5,.item>summary .c6{display:none}
  .thumb{width:56px;height:56px}.detail{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <h1>Vase pipeline results</h1>
    <div class="sub">Met Greek and Roman vases and fragments, described under the controlled vocabulary and linked to Perseus vases.</div>
  </header>
  <div id="app"><p class="muted" style="padding-top:24px">Loading runs…</p></div>
</div>
<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in attrs || {}) { const v = attrs[k]; if (v == null || v === false) continue;
    if (k === 'class') e.className = v; else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v); }
  for (const c of kids.flat(Infinity)) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return e;
}
const ext = (href, text) => h('a', { href, target: '_blank', rel: 'noopener noreferrer' }, text);
const fmt = n => Number(n).toLocaleString('en-US');
const pct = (a, b) => b ? Math.round(100 * a / b) + '%' : '—';
const perseusImg = (id, w) => 'http://iiif.perseus.tufts.edu/iiif/3/' + id + '/full/^' + w + ',/0/default.jpg';
const lsj = g => 'https://www.perseus.tufts.edu/hopper/morph?l=' + encodeURIComponent(g.split(' ')[0]) + '&la=greek';

let RUNS = [], FRAG = {}, SRC = {}, V = null, shapes = {}, state = { q: '', mode: '', rel: '', only: '', sort: 'order', page: 0 };
const PER = 50;
const REL_ORDER = ['exact', 'more specific', 'less specific', 'sibling type', 'same family', 'same function group', 'different'];
const COMP = [['shape', 'Shape'], ['technique', 'Technique'], ['fabric', 'Fabric'], ['date', 'Date'], ['text', 'Text'], ['visual', 'Image']];

const shapeLabel = id => id ? (shapes[id] ? shapes[id].label : id) : null;
const lab = (kind, id) => id ? ((V && V[kind] && V[kind][id]) || id) : null;
function depth(id) { let d = 0, s = shapes[id]; if (!s) return 0; d = 2; while (s && s.parent) { d++; s = shapes[s.parent]; } return d; }
const shapeRel = r => { const row = r.validation && r.validation.rows.find(x => x.field === 'shape'); return row ? row.relation : ''; };
const modelShape = r => r.model && r.model.shape_id && (!V || shapes[r.model.shape_id]) ? r.model.shape_id : null;
const topMatch = r => r.matches && r.matches[0];

function parseRuns(text) { return text.split(/\n+/).map(l => l.trim()).filter(Boolean).map(l => JSON.parse(l)); }
function setVocab(v) { V = v; shapes = {}; if (v) v.shapes.forEach(s => { shapes[s.id] = s; }); }

async function boot() {
  try {
    const [runs, vocab] = await Promise.all([
      fetch('../data/runs.jsonl', { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error('missing'); return r.text(); }),
      fetch('../data/vocab.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null)]);
    const opt = name => fetch('../data/' + name, { cache: 'no-store' }).then(r => r.ok ? r.text() : '').then(t => t ? parseRuns(t) : []).catch(() => []);
    const [frags, srcs] = await Promise.all([opt('fragments.jsonl'), opt('sources.jsonl')]);
    frags.forEach(f => { if (f.source === 'met') FRAG[f.id] = f; }); srcs.forEach(x => { SRC[x.objectID] = x; });
    setVocab(vocab); RUNS = parseRuns(runs); render();
  } catch (e) { renderEmpty(); }
}
function renderEmpty() {
  const app = $('#app'); app.textContent = '';
  const fi = h('input', { type: 'file', accept: '.jsonl,.json,.txt', hidden: true, onchange: ev => { const f = ev.target.files[0]; if (!f) return; const fr = new FileReader(); fr.onload = () => { try { RUNS = parseRuns(String(fr.result)); render(); } catch (err) { $('#msg').textContent = 'That file isn’t a runs.jsonl: each line must be one JSON record.'; } }; fr.readAsText(f); } });
  app.append(h('div', { class: 'note', style: 'margin-top:24px' },
    h('p', {}, 'No runs found at ', h('code', {}, 'data/runs.jsonl'), '.'),
    h('p', {}, 'Run the pipeline, then serve the repository folder and reload this page:'),
    h('p', {}, h('code', {}, 'python -m vasepipe run --mode image'), ' then ', h('code', {}, 'python -m vasepipe serve'), ' and open ', h('code', {}, 'http://localhost:8000/dashboard/results.html')),
    h('p', {}, 'If you opened this page as a file rather than through localhost, choose the runs file yourself. Shape names will show as identifiers.'),
    h('button', { class: 'btn', type: 'button', onclick: () => fi.click() }, 'Choose runs.jsonl'), fi, h('p', { id: 'msg', role: 'status', class: 'small', style: 'margin-top:8px' })));
}

function bars(rows, max) {
  max = max || Math.max(1, ...rows.map(r => r[1]));
  return rows.map(([l, n]) => h('div', { class: 'hbar' }, h('span', {}, l), h('div', { class: 'bar' }, h('i', { style: 'width:' + (100 * n / max) + '%' })), h('span', { class: 'n' }, fmt(n))));
}
function render() {
  const app = $('#app'); app.textContent = '';
  const img = RUNS.filter(r => r.model), cmp = img.filter(r => r.catalogue.shape && modelShape(r));
  const agree = cmp.filter(r => ['exact', 'more specific'].includes(shapeRel(r))).length;
  const noTerm = img.filter(r => !(r.baseline_scan && r.baseline_scan.deepest)).length;
  const oov = img.reduce((a, r) => a + (r.validation ? r.validation.out_of_vocabulary : 0), 0);
  const sc = RUNS.filter(topMatch).map(r => topMatch(r).score), mean = sc.length ? sc.reduce((a, b) => a + b, 0) / sc.length : null;
  const errs = RUNS.filter(r => r.error).length, same = RUNS.filter(r => r.perseus_same_accession).length;
  const kpi = (v, l) => h('div', { class: 'kpi' }, h('b', {}, v), h('span', {}, l));
  app.append(h('section', { class: 'kpis', 'aria-label': 'Summary' },
    kpi(fmt(RUNS.length), 'Objects run'), kpi(fmt(img.length), 'With a model description'),
    kpi(pct(agree, cmp.length), 'Constrained shape agrees with the catalogue'),
    kpi(pct(noTerm, img.length), 'Unconstrained descriptions with no vocabulary shape'),
    kpi(img.length ? fmt(oov) : '—', 'Identifiers outside the vocabulary'),
    kpi(mean == null ? '—' : Math.round(mean * 100) + '%', 'Mean top Perseus match score')));

  const charts = h('section', { class: 'charts' });
  if (cmp.length) {
    const rc = {}; cmp.forEach(r => { const k = shapeRel(r) || 'different'; rc[k] = (rc[k] || 0) + 1; });
    charts.append(h('div', {}, h('h3', {}, 'Constrained shape against the catalogue'), h('p', { class: 'small muted' }, fmt(cmp.length) + ' objects where both name a vocabulary shape.'), bars(REL_ORDER.filter(k => rc[k]).map(k => [k, rc[k]]))));
  }
  if (img.length && V) {
    const lv = r => ({ 0: 'No shape term', 2: 'Shape', 3: 'Variant', 4: 'Sub-variant' })[r] || 'Shape';
    const order = ['No shape term', 'Shape', 'Variant', 'Sub-variant'], b = {}, c = {};
    img.forEach(r => { const x = lv(depth(r.baseline_scan && r.baseline_scan.deepest)), y = lv(depth(modelShape(r))); b[x] = (b[x] || 0) + 1; c[y] = (c[y] || 0) + 1; });
    const mx = Math.max(1, ...order.map(k => Math.max(b[k] || 0, c[k] || 0)));
    charts.append(h('div', {}, h('h3', {}, 'How specific each description is'), h('p', { class: 'small muted' }, 'Deepest hierarchy level reached, by number of objects.'),
      h('div', { class: 'small', style: 'font-weight:600;margin-top:6px' }, 'Unconstrained'), bars(order.map(k => [k, b[k] || 0]), mx),
      h('div', { class: 'small', style: 'font-weight:600;margin-top:10px' }, 'Vocabulary-constrained'), bars(order.map(k => [k, c[k] || 0]), mx)));
  }
  const fn = {}; RUNS.forEach(r => { const s = shapes[r.catalogue.shape]; const k = s && V ? (V.fn.find(f => f[0] === s.fn) || [0, s.fn])[1] : (r.catalogue.shape ? 'Named shape' : 'Not in vocabulary'); fn[k] = (fn[k] || 0) + 1; });
  charts.append(h('div', {}, h('h3', {}, 'Catalogue shapes by function group'), h('p', { class: 'small muted' }, 'Read from each Met record’s object name.'), bars(Object.entries(fn).sort((a, b) => b[1] - a[1]))));
  app.append(charts);
  const fc = Object.values(FRAG).flatMap(f => f.candidates), tier = t => fc.filter(c => c.tier === t).length;
  const sv = Object.values(SRC), cdm = sv.reduce((a, x) => a + (x.contentdm || []).length, 0);
  if (fc.length || sv.length) app.append(h('p', { class: 'small', style: 'padding-top:var(--sp-micro)' },
    fc.length ? 'Complementary fragments: ' + fmt(tier('strong')) + ' strong, ' + fmt(tier('possible')) + ' possible and ' + fmt(tier('weak')) + ' weak candidates across ' + fmt(Object.values(FRAG).filter(f => f.candidates.length).length) + ' fragments. ' : '',
    sv.length ? 'Sources: ' + fmt(sv.filter(x => x.references.length).length) + ' objects with Perseus references, ' + fmt(cdm) + ' CONTENTdm records.' : ''));
  if (errs || same) app.append(h('p', { class: 'small muted', style: 'padding-top:var(--sp-micro)' }, [errs ? fmt(errs) + ' runs recorded a problem.' : '', same ? fmt(same) + ' objects share an accession number with a Perseus record.' : ''].filter(Boolean).join(' ')));

  const rels = [...new Set(RUNS.map(shapeRel).filter(Boolean))].sort((a, b) => REL_ORDER.indexOf(a) - REL_ORDER.indexOf(b));
  const sel = (id, label, opts, key) => h('div', {}, h('label', { class: 'lbl', for: id }, label), h('select', { id, onchange: e => { state[key] = e.target.value; state.page = 0; drawList(); } }, opts.map(([v, l]) => h('option', { value: v, selected: state[key] === v }, l))));
  app.append(h('section', { class: 'filters' },
    h('div', { class: 'grow' }, h('label', { class: 'lbl', for: 'q' }, 'Search'), h('input', { type: 'search', id: 'q', placeholder: 'Type to search…', oninput: e => { state.q = e.target.value; state.page = 0; drawList(); } })),
    sel('f-mode', 'Run type', [['', 'All runs'], ['image', 'Image runs'], ['catalogue', 'Catalogue runs']], 'mode'),
    sel('f-rel', 'Against catalogue', [['', 'Any result']].concat(rels.map(r => [r, r[0].toUpperCase() + r.slice(1)])), 'rel'),
    sel('f-only', 'Show', [['', 'Everything'], ['fragment', 'Fragments'], ['error', 'Runs with a problem'], ['oov', 'Terms outside the vocabulary'], ['same', 'Same accession in Perseus'], ['frag', 'With fragment candidates'], ['cdm', 'With CONTENTdm material']], 'only'),
    sel('f-sort', 'Order', [['order', 'Run order'], ['score-desc', 'Highest match score'], ['score-asc', 'Lowest match score']], 'sort')),
    h('div', { id: 'list' }));
  drawList();
}

function filtered() {
  const q = state.q.toLowerCase();
  let rows = RUNS.filter(r => (!state.mode || r.mode === state.mode) && (!state.rel || shapeRel(r) === state.rel)
    && (!q || [r.accessionNumber, r.title, r.objectName, r.culture, shapeLabel(r.catalogue.shape), shapeLabel(modelShape(r)), topMatch(r) && topMatch(r).name].join(' ').toLowerCase().includes(q))
    && (state.only === '' || (state.only === 'fragment' && r.catalogue.fragment) || (state.only === 'error' && r.error) || (state.only === 'oov' && r.validation && r.validation.out_of_vocabulary) || (state.only === 'same' && r.perseus_same_accession) || (state.only === 'frag' && FRAG[r.objectID] && FRAG[r.objectID].candidates.length) || (state.only === 'cdm' && SRC[r.objectID] && (SRC[r.objectID].contentdm || []).length)));
  if (state.sort !== 'order') { const d = state.sort === 'score-desc' ? -1 : 1; rows = rows.slice().sort((a, b) => d * (((topMatch(a) || {}).score || 0) - ((topMatch(b) || {}).score || 0))); }
  return rows;
}
function thumb(src, alt, cls) {
  if (!src) return h('div', { class: 'thumb none ' + (cls || '') }, 'No image');
  const im = h('img', { class: 'thumb ' + (cls || ''), src, alt, loading: 'lazy', referrerpolicy: 'no-referrer' });
  im.addEventListener('error', () => im.replaceWith(h('div', { class: 'thumb none ' + (cls || '') }, 'Image unavailable')));
  return im;
}
function relBadge(r) {
  const k = shapeRel(r); if (!k) return r.mode === 'catalogue' ? h('span', { class: 'badge' }, 'Catalogue only') : null;
  return h('span', { class: 'badge ' + (k === 'exact' || k === 'more specific' ? 'good' : k === 'different' ? 'bad' : 'ink') }, k);
}
function drawList() {
  const box = $('#list'); box.textContent = '';
  const rows = filtered(), pages = Math.max(1, Math.ceil(rows.length / PER)); state.page = Math.min(state.page, pages - 1);
  box.append(h('p', { class: 'small muted' }, fmt(rows.length) + ' of ' + fmt(RUNS.length) + ' objects. Select a row for the full record.'));
  if (!rows.length) { box.append(h('p', { class: 'muted' }, 'No objects match these filters.')); return; }
  rows.slice(state.page * PER, state.page * PER + PER).forEach(r => {
    const t = topMatch(r), ms = modelShape(r);
    const d = h('details', { class: 'item' }, h('summary', {},
      thumb(r.image, ''),
      h('div', {}, h('div', { class: 't' }, r.title || r.objectName || r.accessionNumber), h('div', { class: 'small muted' }, [r.accessionNumber, r.culture, r.objectDate].filter(Boolean).join(' · '))),
      h('div', { class: 'c3 small' }, h('div', {}, 'Catalogue: ' + (shapeLabel(r.catalogue.shape) || 'not in vocabulary') + (r.catalogue.fragment ? ', fragment' : '')), r.model ? h('div', {}, 'Model: ' + (shapeLabel(ms) || 'no shape')) : null, relBadge(r)),
      h('div', { class: 'arrow', 'aria-hidden': 'true' }, '→'),
      h('div', { class: 'c5' }, t ? thumb(t.images && t.images[0] ? perseusImg(t.images[0], 150) : null, '') : null),
      h('div', { class: 'c6 small' }, t ? [h('div', { class: 't' }, t.name), h('div', { class: 'muted' }, [t.shape, t.ware].filter(Boolean).join(', '))] : 'No match'),
      h('div', { class: 'score' }, t ? Math.round(t.score * 100) + '%' : '')));
    d.addEventListener('toggle', () => { if (d.open && !d.dataset.built) { d.dataset.built = '1'; d.append(detail(r)); } });
    box.append(d);
  });
  if (pages > 1) box.append(h('div', { class: 'pager' },
